version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pulsewatch-postgres
    environment:
      POSTGRES_USER: pulsewatch
      POSTGRES_PASSWORD: pulsewatch_pass
      POSTGRES_DB: pulsewatch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsewatch -d pulsewatch_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pulsewatch-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsewatch-backend
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://pulsewatch:pulsewatch_pass@postgres:5432/pulsewatch_db
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS=true
      - JWT_SECRET=pulsewatch-super-secret-key-change-in-production-2026-groww
      - MARKET_DATA_PROVIDER=demo
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulsewatch-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
